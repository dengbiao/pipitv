# This file is included from the existing Nginx container's http context. The
# container must be attached to the external pipi_broker_ingress network.
server {
    listen 80;
    listen [::]:80;
    server_name oauth.dreamcanvas.site;

    access_log off;
    error_log /dev/stderr crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location / {
        # Drop any query string so an accidental HTTP OAuth callback cannot
        # echo code/state into the Location response header.
        return 308 https://oauth.dreamcanvas.site$uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oauth.dreamcanvas.site;

    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/oauth.dreamcanvas.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oauth.dreamcanvas.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 5s;
    client_body_timeout 15s;
    keepalive_timeout 5s;
    send_timeout 15s;

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 2s;
    set $broker_upstream http://baidu-token-broker:8080;

    # Android App Links association for the currently installed debug build. Before any formal
    # release, add the final Play App Signing certificate fingerprint and remove this debug-only
    # fingerprint from the production host after the migration window.
    location = /.well-known/assetlinks.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.pipiclassroom.app","sha256_cert_fingerprints":["F7:98:AB:AD:8C:E7:01:02:F4:C7:29:6C:E4:06:9A:D8:E8:64:DD:FB:2F:23:6D:DB:9A:7B:4A:80:1C:B0:8A:2D"]}}]';
    }

    location / {
        proxy_pass $broker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host oauth.dreamcanvas.site;
        proxy_set_header Connection "";

        # This is the sole client-identity header accepted by the broker. It is
        # overwritten from Nginx's socket peer and is never copied from input.
        proxy_set_header X-Broker-Client-IP $remote_addr;

        # Strip client-controlled forwarding and CDN identity before proxying.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header X-Cluster-Client-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";

        # The broker has no use for browser credentials or navigation context.
        # Never forward them into the OAuth code/token handling process.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header Referer "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
        proxy_buffering off;

        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_store off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Expires "0" always;
        add_header Pragma "no-cache" always;
    }
}
